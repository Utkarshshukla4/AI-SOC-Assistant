<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Create Account - AI SOC Assistant</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">
```

</head>

<body>

<div class="auth-container">

```
<div class="auth-card">

    <h1>Create Account</h1>

    <p class="text-muted">
        Create your SOC Analyst account
    </p>


    {% if error %}

    <div class="alert alert-danger">

        {{ error }}

    </div>

    {% endif %}


    <form method="POST">

        <div class="form-group">

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                class="form-input"
                placeholder="Choose a username"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-input"
                placeholder="Choose a password"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Confirm Password
            </label>

            <input
                type="password"
                name="confirm_password"
                class="form-input"
                placeholder="Confirm your password"
                required
            >

        </div>


        <button
            type="submit"
            class="btn btn-primary"
            style="width: 100%;">

            Create Account

        </button>

    </form>


    <p style="margin-top: 20px;">

        Already have an account?

        <a href="/login">

            Login

        </a>

    </p>

</div>
```

</div>

</body>

</html>
